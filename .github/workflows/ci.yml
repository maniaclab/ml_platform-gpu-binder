name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.1
          environments: dev
      - run: pixi run -e dev pre-commit

  base-image:
    # The full image is several GiB, so check that the pinned base image
    # resolves instead of building it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned base image
        run:
          docker buildx imagetools inspect "$(awk '/^FROM /{print $2}'
          Dockerfile)"
