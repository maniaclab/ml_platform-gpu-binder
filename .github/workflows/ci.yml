name: CI

on:
  pull_request:
  push:
    # renovate/** too: digest bumps are branch-automerged, and Renovate only
    # merges a branch whose checks have passed.
    branches: [main, "renovate/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.68.1
          environments: dev
      - run: pixi run -e dev pre-commit

  base-image:
    # The full image is several GiB, so check that the pinned base image
    # resolves instead of building it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned base image
        run:
          docker buildx imagetools inspect "$(awk '/^FROM /{print $2}'
          Dockerfile)"
