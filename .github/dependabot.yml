version: 2
updates:
  # Maintain dependencies for GitHub Actions. The base image is handled by
  # Renovate (renovate.json), which can follow :latest by digest.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    labels:
      - "github-actions"
      - "dependencies"
    reviewers:
      - "kratsg"
