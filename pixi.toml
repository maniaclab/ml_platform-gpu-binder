[workspace]
name = "ml_platform-gpu-binder"
version = "0000.00.00"
description = "Thin BinderHub repo wrapping the ml-platform-gpu image"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.dev.dependencies]
python = "3.12.*"
tbump = "*"
prek = "*"

[feature.dev.tasks]
tbump = { cmd = "tbump", description = "Run tbump (on a release/v<version> branch, see README)" }
pin-base = { cmd = "python scripts/pin_base.py", description = "Pin the FROM line to a tag and its current digest" }
pre-commit = { cmd = "prek run --all-files", description = "Run pre-commit hooks on all files" }

[environments]
dev = ["dev"]
